[defaults]
inventory           = inventory/hosts.ini
roles_path          = roles
remote_user         = root
host_key_checking   = False
pipelining          = True
gather_facts        = True
retry_files_enabled = False
result_format       = yaml

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
