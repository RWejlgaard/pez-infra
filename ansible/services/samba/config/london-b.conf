[global]
   workgroup = WORKGROUP
   server string = %h server (Samba, Ubuntu)
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
   server role = standalone server
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
   pam password change = yes
   map to guest = bad user

   # COCKPIT ZFS MANAGER
   # WARNING: DO NOT EDIT, AUTO-GENERATED CONFIGURATION
   include = /etc/cockpit/zfs/shares.conf

[HDD]
   comment = HDD
   path = /hdd
   valid users = pez root
   public = no
   writable = yes

# vzdump target for the Proxmox hosts. One subdirectory per host, because
# VMIDs overlap between london-a and copenhagen-a and retention prunes by VMID.
# The user is created by the media_stack role; its name must match
# proxmox_ve_backup_smb_user in group_vars/all/secrets.enc.yaml.
[pve-backups]
   comment = Proxmox VE backups
   path = /hdd/pve/backups
   valid users = pvebackup
   browseable = no
   writable = yes
   create mask = 0640
   directory mask = 0750

[Movies]
   comment = Movies
   path = /hdd/movies
   public = yes
   writable = no

[TV Shows]
   comment = TV Shows
   path = /hdd/tv
   public = yes
   writable = no

[printers]
   comment = All Printers
   browseable = no
   path = /var/tmp
   printable = yes
   guest ok = no
   read only = yes
   create mask = 0700

[print$]
   comment = Printer Drivers
   path = /var/lib/samba/printers
   browseable = yes
   read only = yes
   guest ok = no
