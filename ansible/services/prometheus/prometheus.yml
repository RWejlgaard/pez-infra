# Prometheus configuration — extracted from london-a (FreeBSD)
# Config file location on london-a: /usr/local/etc/prometheus.yml
# Prometheus runs as: /usr/local/bin/prometheus --config.file=/usr/local/etc/prometheus.yml
# Data directory: /var/db/prometheus

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["192.168.1.254:9100"]
        labels:
          location: london
          server: london-a
      - targets: ["192.168.1.253:9100"]
        labels:
          location: london
          server: london-b
      - targets: ["100.89.206.60:9100"]
        labels:
          location: copenhagen
          server: copenhagen-a
      - targets: ["100.115.45.53:9100"]
        labels:
          location: copenhagen
          server: copenhagen-c
      - targets: ["100.117.235.28:9100"]
        labels:
          location: cloud
          server: nuremberg-a
      - targets: ["100.67.6.27:9100"]
        labels:
          location: cloud
          server: helsinki-a

  - job_name: "smartmontools"
    static_configs:
      - targets: ["192.168.1.253:9633"]
        labels:
          location: london
          server: london-b

  - job_name: "plex"
    static_configs:
      - targets: ["192.168.1.253:9000"]
        labels:
          location: london
          server: london-b

  - job_name: "caddy"
    static_configs:
      - targets: ["100.67.6.27:2019"]
        labels:
          location: cloud
          server: helsinki-a
