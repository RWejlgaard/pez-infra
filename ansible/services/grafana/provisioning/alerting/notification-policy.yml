---
apiVersion: 1

# Notification routing policy.
# Critical alerts (severity=critical) → PagerDuty.
# Warning alerts (severity=warning) → email.

policies:
  - orgId: 1
    receiver: PagerDuty
    group_by:
      - alertname
      - server
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: PagerDuty
        matchers:
          - severity = critical
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 1h
        continue: false

      - receiver: email
        matchers:
          - severity = warning
        group_wait: 2m
        group_interval: 10m
        repeat_interval: 8h
        continue: false
