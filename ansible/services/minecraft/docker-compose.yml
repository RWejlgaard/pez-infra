---
# Minecraft - PaperMC server
# Host: copenhagen-a (100.89.206.60)
# Data: Docker volume (minecraft_minecraftserver)

services:
  minecraft:
    image: marctv/minecraft-papermc-server:latest
    container_name: mcserver
    restart: always
    ports:
      - "25565:25565"
    environment:
      MEMORYSIZE: 3G
    volumes:
      - minecraft_data:/data

volumes:
  minecraft_data:
    name: minecraft_minecraftserver
