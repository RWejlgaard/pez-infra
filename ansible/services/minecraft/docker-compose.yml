---
# Minecraft - PaperMC server
# Host: copenhagen-a (100.89.206.60)
# Data: Docker volume (minecraft_minecraftserver)

services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: mcserver
    restart: always
    ports:
      - "25565:25565"
    environment:
      EULA: true
      DIFFICULTY: hard
      MEMORYSIZE: 3G
      VERSION: 1.21.11
      MOTD: Pez Solutions

    volumes:
      - minecraft_data:/data

volumes:
  minecraft_data:
    name: minecraft_minecraftserver
